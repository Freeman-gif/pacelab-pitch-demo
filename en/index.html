<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta name="description" content="PACELAB × ENGINE BIRD: Cross-platform marathon pace-train matching, fair run-club leagues, Run Super city-vs-city PK (with cycling & swimming EEP fusion), and Proof-of-Run brand ROI." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PACELAB × ENGINE BIRD · Interactive Running Startup Pitch Demo" />
  <meta property="og:description" content="Try the live interactive prototype: multi-watch sync, marathon pace trains, fair club ranking, city-vs-city Run Super League, cycling/swim EEP conversion, and live brand ROI calculator." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1419'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FC4C02'/%3E%3C/svg%3E" />
  <title>PACELAB × ENGINE BIRD · Interactive Running Pitch Demo</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="mode-studio">
  <header class="studio-topbar" id="studioTopbar">
    <div class="topbar-left">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span class="brand-name">PACELAB</span>
        <span class="brand-cn" id="brandCnText">Running Social</span>
      </div>
      <span class="brand-x">×</span>
      <div class="partner-badge">
        <span class="partner-en">ENGINE BIRD</span>
        <span class="partner-cn" id="partnerCnText">Partner Pitch Demo</span>
      </div>
    </div>

    <nav class="chapter-nav" id="chapterNav" aria-label="Pitch chapters">
      <button class="chapter-pill active" data-chapter="0">
        <span class="pill-num">01</span>
        <span class="pill-label">Sync &amp; Wedge</span>
      </button>
      <button class="chapter-pill" data-chapter="1">
        <span class="pill-num">02</span>
        <span class="pill-label">Pace Trains</span>
      </button>
      <button class="chapter-pill" data-chapter="2">
        <span class="pill-num">03</span>
        <span class="pill-label">Fair Clubs</span>
      </button>
      <button class="chapter-pill" data-chapter="3">
        <span class="pill-num">04</span>
        <span class="pill-label">Run Super</span>
      </button>
      <button class="chapter-pill" data-chapter="4">
        <span class="pill-num">05</span>
        <span class="pill-label">Partner ROI</span>
      </button>
    </nav>

    <div class="topbar-right">
      <div class="lang-switch" id="langSwitchDesktop" role="group" aria-label="Language switcher">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn active" data-lang="en">EN</button>
      </div>
      <button class="studio-btn subtle" id="togglePhoneOnlyBtn" title="Toggle Phone-Only Prototype View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18h4"/></svg>
        <span id="togglePhoneOnlyText">Phone Only</span>
      </button>
      <div class="kbd-hint" title="Use Left / Right arrows to switch chapters">
        <kbd>←</kbd><kbd>→</kbd>
      </div>
    </div>
  </header>

  <div class="mobile-mode-bar" id="mobileModeBar">
    <button class="mobile-mode-btn active" data-mobile-view="phone" id="mobileBtnPhone">Try Mini App</button>
    <button class="mobile-mode-btn" data-mobile-view="pitch" id="mobileBtnPitch">Pitch &amp; ROI</button>
    <button class="mobile-lang-btn" id="mobileLangBtn" title="Switch Language">中文</button>
  </div>

  <main class="studio-workspace">
    <section class="pitch-pane" id="pitchPane" aria-label="Interactive Pitch Storyboard">
      <div class="pitch-scroll" id="pitchScroll">
        <div id="pitchContent"></div>

        <footer class="pitch-footer-nav">
          <button class="footer-step-btn" id="prevChapterBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span>Previous</span>
          </button>
          <div class="chapter-dots" id="chapterDots"></div>
          <button class="footer-step-btn primary" id="nextChapterBtn">
            <span>Next Chapter</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </footer>
      </div>
    </section>

    <section class="device-pane" id="devicePane" aria-label="Live WeChat Mini Program Prototype">
      <div class="device-stage">
        <div class="device-caption">
          <span class="live-indicator"><span class="live-dot"></span> <span id="liveBadgeText">Interactive Prototype</span></span>
          <span class="caption-sep">·</span>
          <span id="deviceSyncHint">Live demo: Multi-platform sync &amp; AI screenshot OCR</span>
        </div>

        <div class="iphone-shell">
          <div class="iphone-notch">
            <div class="notch-camera"></div>
          </div>

          <div class="phone-screen" id="phoneScreen">
            <div class="wx-header">
              <div class="ios-statusbar">
                <span class="status-time">06:42</span>
                <div class="status-icons">
                  <svg viewBox="0 0 18 12" fill="currentColor" width="15" height="10"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
                  <span class="status-5g">5G</span>
                  <div class="battery"><div class="battery-fill"></div></div>
                </div>
              </div>
              <div class="wx-navbar">
                <div class="wx-nav-left">
                  <span class="wx-title" id="wxNavTitle">PACELAB</span>
                  <span class="wx-city-pill" id="wxCityPill">Guangzhou</span>
                </div>
                <div class="wx-capsule" aria-hidden="true">
                  <span class="capsule-dots">•••</span>
                  <span class="capsule-div"></span>
                  <span class="capsule-eye"></span>
                </div>
              </div>
            </div>

            <div class="por-strip" id="porStrip">
              <div class="por-strip-left">
                <span class="por-label" id="porLabelText">Verified Miles</span>
                <strong class="por-value" id="porMileageText">26.4</strong>
                <span class="por-unit" id="porUnitText">/ 30 km to unlock VIP</span>
              </div>
              <button class="por-sync-btn" id="openSyncModalBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                <span id="porSyncBtnText">Sync Run</span>
              </button>
            </div>
            <div class="por-progress-track">
              <div class="por-progress-fill" id="porProgressFill" style="width: 88%;"></div>
            </div>

            <div class="phone-body" id="phoneBody"></div>
            <div class="phone-toast" id="phoneToast" role="status" aria-live="polite"></div>

            <nav class="phone-tabbar" id="phoneTabbar" aria-label="App navigation">
              <button class="tab-item active" data-tab="match">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span>Match</span>
              </button>
              <button class="tab-item" data-tab="clubs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                <span>Clubs</span>
              </button>
              <button class="tab-item" data-tab="pk">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>City PK</span>
              </button>
              <button class="tab-item" data-tab="perks">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                <span>Perks</span>
                <span class="tab-badge" id="perksTabBadge" style="display:none;">VIP</span>
              </button>
            </nav>

            <div class="phone-sheet-backdrop" id="phoneSheetBackdrop">
              <div class="phone-sheet" id="phoneSheet"></div>
            </div>

            <div class="ios-home-indicator"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>window.__INITIAL_LANG__ = "en";</script>
  <script src="../data.js"></script>
  <script src="../data-en.js"></script>
  <script src="../app.js"></script>
</body>
</html>
